name: Deploy react to S3

inputs:
  aws-role-to-assume:
    required: false
  react-app-mapbox-token:
    required: false
    type: string
    default: undefined
  google-tag:
    required: false
    type: string
    default: undefined
  version:
    required: false
    type: string
    default: undefined
  deploy:
    description: Whether to deploy the image to ECR since github actions don't have a boolean use 'true' or
    required: false
    default: false
  s3-bucket-name:
    required: false
    default: conflict-nightlight-frontend
  domain-name:
    required: false
    default: conflictnightlight.ericcbonet.com

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      working-directory: frontend
      run: yarn install --frozen-lockfile

    - name: Build app
      shell: bash
      working-directory: frontend
      run: REACT_APP_MAPBOX_TOKEN=${{ inputs.react-app-mapbox-token }} GOOGLE_TAG=${{ inputs.google-tag}} REACT_APP_VERSION=${{ inputs.version }} yarn build

    - name: Configure AWS
      if: ${{ inputs.deploy == 'true' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: eu-central-1

    - name: Sync to S3
      working-directory: frontend
      shell: bash
      if: ${{ inputs.deploy == 'true' }}
      run: aws s3 sync build s3://${{ inputs.s3-bucket-name }}/ --delete

    - name: Invalidate CloudFront cache
      if: ${{ inputs.deploy == 'true' }}
      shell: bash
      working-directory: frontend
      run: |
        distribution_id=$(aws cloudfront list-distributions \
          --query "DistributionList.Items[?Aliases.Items != null && contains(Aliases.Items, '${{ inputs.domain-name }}')].Id | [0]" \
          --output text)

        if [[ -z "${distribution_id}" || "${distribution_id}" == "None" ]]; then
          echo "Could not find a CloudFront distribution for ${{ inputs.domain-name }}" >&2
          exit 1
        fi

        aws cloudfront create-invalidation \
          --distribution-id "${distribution_id}" \
          --paths "/*"
